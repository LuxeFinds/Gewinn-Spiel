<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LuxeFinds Gewinnspiel</title>
<style>
body {
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg, #000, #111);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: #ffd700;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
h1 {
  font-size: 2rem;
  margin: 25px 0 15px;
  text-shadow: 0 0 10px #ffd700, 0 0 20px #b8860b;
  text-align: center;
}
.container {
  background: #1a1a1a;
  padding: 18px;
  width: 84%;
  max-width: 360px;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
input, button {
  width: 100%;
  padding: 9px;
  border-radius: 6px;
  border: 1px solid #b8860b;
  background: #111;
  color: #ffd700;
  font-size: 13px;
  outline: none;
  transition: all .3s;
}
input:focus {
  border-color: #ffd700;
  box-shadow: 0 0 5px #ffd700;
}
button {
  background: #b8860b;
  color: #000;
  font-weight: bold;
  cursor: pointer;
  font-size: 13.5px;
  padding: 9px;
}
button:hover {
  background: #ffd700;
  box-shadow: 0 0 10px #ffd700;
}
#errorMessage {
  color: red;
  font-weight: bold;
  margin-top: 6px;
  min-height: 18px;
  text-align: center;
  font-size: 12.5px;
}
#result {
  margin-top: 20px;
  padding: 10px;
  font-size: 15px;
  line-height: 1.4;
  text-align: center;
  min-height: 100px;
}
.win { color: #ffffff; text-shadow: 0 0 8px #ffd700; }
.lose { color: #ff6666; }
.loader {
  display: none;
  margin-top: 10px;
  border: 3px solid #222;
  border-top: 3px solid #ffd700;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  animation: spin 1s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
@media (max-width: 600px) {
  h1 { font-size: 1.5rem; margin: 20px 0 10px; }
  .container { padding: 15px; width: 88%; gap: 6px; }
  input, button { font-size: 12.5px; padding: 8px; }
  button { font-size: 13px; }
  #result { font-size: 14px; }
}
</style>
</head>
<body>

<h1>LuxeFinds Gewinnspiel</h1>

<div class="container">
  <input id="email" type="email" placeholder="E-Mail eingeben">
  <input id="order" type="text" placeholder="Bestellnummer (# + 5 Zeichen)" maxlength="6">
  <input id="code" type="text" placeholder="Gewinncode eingeben">
  <button onclick="checkCode()">Überprüfen</button>
  <div class="loader" id="loader"></div>
  <div id="errorMessage"></div>
</div>

<div id="result"></div>

<script>
const prizes = {
  "LF-H1Z5N":"5 CHF Rabatt","LF-L9G2V":"Gratis Versand","LF-A0B2Y":"Gratis Versand",
  "LF-J0H6S":"10% Rabatt","LF-P3K6X":"10% Rabatt","LF-X2Q9M":"Gratis Versand",
  "LF-J7N3T":"Leider verloren","LF-K6S9T":"Gratis Versand","LF-R7F1D":"Leider verloren",
  "LF-C2D7Y":"Gratis Versand","LF-Q6H4X":"5 CHF Rabatt","LF-C6P1Y":"Leider verloren",
  "LF-U6C7N":"5 CHF Rabatt","LF-B0K8G":"5 CHF Rabatt","LF-Z1W3H":"Gratis Versand",
  "LF-T0L5P":"Leider verloren","LF-G2R5H":"1x Vape 50K Gratis","LF-H9Z7G":"Leider verloren",
  "LF-U7P8Q":"Leider verloren","LF-Z8M6Q":"5 CHF Rabatt","LF-B4V8C":"1x Vape 50K Gratis",
  "LF-T1R9F":"Leider verloren","LF-W2S6Q":"5 CHF Rabatt","LF-Z5Q0J":"10% Rabatt",
  "LF-R4K7J":"Leider verloren","LF-K3D5R":"10% Rabatt","LF-N0P7T":"Leider verloren",
  "LF-V5G3K":"10% Rabatt","LF-A3M1K":"10% Rabatt","LF-P5A4V":"10% Rabatt",
  "LF-Y9N4C":"5 CHF Rabatt","LF-E0B4X":"10% Rabatt","LF-E4W9H":"Leider verloren",
  "LF-Q3V4Y":"Leider verloren","LF-X4P8R":"Gratis Versand","LF-X7W1D":"1x Vape 50K Gratis",
  "LF-S8V2M":"10% Rabatt","LF-J5X2P":"5 CHF Rabatt","LF-W1D7L":"Gratis Versand",
  "LF-Q8W4A":"Leider verloren","LF-S5N6D":"5 CHF Rabatt","LF-P8T0L":"10% Rabatt",
  "LF-7K2VQ":"10% Rabatt","LF-V8C2R":"5 CHF Rabatt","LF-C9S6L":"5 CHF Rabatt",
  "LF-M1R2K":"Gratis Versand","LF-G8P1V":"Leider verloren","LF-V3D0A":"Leider verloren",
  "LF-F0M9Z":"Leider verloren","LF-L1T3G":"5 CHF Rabatt","LF-T9B6M":"Gratis Versand",
  "LF-N5S8F":"Leider verloren","LF-H2L8B":"10% Rabatt","LF-F8N0C":"5 CHF Rabatt",
  "LF-M6S0P":"Leider verloren","LF-N3Z5L":"Gratis Versand","LF-Y2P0R":"5 CHF Rabatt",
  "LF-B9M1T":"Leider verloren","LF-R2G8K":"5 CHF Rabatt"
};

// Discord Webhooks
const webhookWinner = "https://discord.com/api/webhooks/1446073985589842012/b5jC1rr4ZYJwvGkbOgWjqSRcqxmx5hnLS5LRfrca8hc0ikKgWQ1A_zmLInLz1USksyTz";
const webhookLoser  = "https://discord.com/api/webhooks/1446082624404586589/YEIVR-9aQlnzGcxNUGGML0VhWynsBOJd29sMLkx7lPusw7lpdejtT6ZH0oO47FjurS7I";
const webhookRepeat = "https://discord.com/api/webhooks/1446082635725148254/2fW0kb-5drRzDCa5op-Hr3HwymXZVkcCOHj8Pq_3pVGDN_bH-IXFDko0oqyurUWDcMRS";

// Dein Make Webhook (für Rabatt + E-Mail)
const makeWebhook = "https://hook.eu1.make.com/cabwpbyntt4lixcofz7n5i63pgktm3fp";

let usedCodes = JSON.parse(localStorage.getItem("usedCodes") || "[]");

function sendToDiscord(webhook, title, color, email, order, code, resultText) {
  fetch(webhook, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      embeds: [{
        title: title,
        color: color,
        thumbnail: { url: "https://i.ibb.co/wQpQWJz/luxefinds-logo.png" },
        fields: [
          { name: "E-Mail", value: email || "Nicht angegeben", inline: true },
          { name: "Bestellnummer", value: order || "Nicht angegeben", inline: true },
          { name: "Gewinncode", value: code, inline: true },
          { name: "Ergebnis", value: resultText, inline: false }
        ],
        footer: { text: "LuxeFinds Gewinnsystem" },
        timestamp: new Date()
      }]
    })
  });
}

function validateOrderNumber(o) {
  return /^#[a-zA-Z0-9]{5}$/.test(o);
}

function checkCode() {
  const email = document.getElementById("email").value.trim();
  const order = document.getElementById("order").value.trim();
  const code = document.getElementById("code").value.trim().toUpperCase();
  const result = document.getElementById("result");
  const error = document.getElementById("errorMessage");
  const loader = document.getElementById("loader");

  result.innerHTML = "";
  error.innerHTML = "";

  if (!email || !order || !code) {
    error.innerHTML = "Bitte alle Felder ausfüllen!";
    return;
  }
  if (!validateOrderNumber(order)) {
    error.innerHTML = "Ungültige Bestellnummer! Format: # + 5 Zeichen";
    return;
  }

  if (usedCodes.includes(code)) {
    error.innerHTML = "Dieser Gewinncode wurde bereits verwendet!";
    sendToDiscord(webhookRepeat, "⚠️ Doppelter Code-Versuch erkannt!", 16753920, email, order, code, "Versuch, bereits eingelösten Code erneut zu verwenden");
    return;
  }

  loader.style.display = "block";

  setTimeout(() => {
    loader.style.display = "none";
    const prize = prizes[code];

    usedCodes.push(code);
    localStorage.setItem("usedCodes", JSON.stringify(usedCodes));

    if (!prize) {
      result.innerHTML = "<div style='color:#ff4444; font-size:20px;'>Ungültiger Code</div>";
      result.className = "lose";
      return;
    }

    if (prize === "Leider verloren") {
      result.innerHTML = "<div style='font-size:20px; color:#ff6666;'>Leider verloren 😢</div><br>Schade, diesmal hat es nicht geklappt.<br>Versuch es beim nächsten Einkauf einfach nochmal!";
      result.className = "lose";
      sendToDiscord(webhookLoser, "❌ Kein Gewinn", 16711680, email, order, code, "Leider kein Gewinn.");
    } else {
      result.innerHTML = "<div style='font-size:26px; color:#ffffff; text-shadow:0 0 15px #ffd700;'>🎉 Herzlichen Glückwunsch!</div><div style='font-size:20px; color:#ffd700; margin-top:10px;'>Du hast gewonnen: <b>" + prize + "</b></div><br><div style='color:#ffffff;'>📩 Du wirst innerhalb von 24 Stunden per E-Mail kontaktiert.</div>";
      result.className = "win";
      sendToDiscord(webhookWinner, "🎉 Neuer Gewinner!", 16766720, email, order, code, prize);

      // Automatisch an Make senden (Rabatt & E-Mail)
      const discountType = prize.includes("%") ? "PERCENT" : (prize.includes("CHF") ? "ABS" : null);
      const discountValue = prize.includes("%") ? 10 : (prize.includes("CHF") ? 5 : 0);

      fetch(makeWebhook, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: email,
          code: code,
          prize: prize,
          discountType: discountType,
          discountValue: discountValue
        })
      });
    }
  }, 1000);
}
</script>
</body>
</html>
